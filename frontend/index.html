<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zedchatbot | African Community Assistant</title>
    <meta name="description" content="A multilingual AI assistant for Zambian and Zimbabwean communities, powered by RAG technology." />
    <link rel="icon" href="./assets/images/logo.jpeg" type="image/jpeg" />
    <!-- Modular CSS -->
    <link rel="stylesheet" href="./css/main.css?v=6" />
    <link rel="stylesheet" href="./css/layout.css?v=6" />
    <link rel="stylesheet" href="./css/components.css?v=6" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <img src="./assets/images/logo.jpeg" alt="Zedchatbot Logo" class="hero-logo" />
        <div class="hero-text">
          <span class="eyebrow">Zambia-first RAG assistant</span>
          <h1>Zedchatbot</h1>
          <p class="intro">
            Access trusted information on local services, education, and government
            right here. Select your language to get started.
          </p>
        </div>
      </header>

      <div class="chat-card">
        <div class="controls">
          <label for="country">
            Country
            <select id="country">
              <option value="zm">Zambia</option>
              <option value="zw">Zimbabwe</option>
            </select>
          </label>
          <label for="language">
            Language
            <select id="language">
              <option value="en">English</option>
              <option value="bem">Bemba</option>
              <option value="ny">Nyanja</option>
              <option value="sn">Shona</option>
            </select>
          </label>
        </div>

        <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversation">
          <!-- Initial greeting will be handled by JS -->
        </div>

        <div class="suggestions">
          <span class="suggestions-label">Try asking</span>
          <div class="suggestions-row">
            <button class="suggestion-chip" data-prompt="What are the 2026 ZESCO electricity tariffs?" aria-label="Ask about ZESCO electricity tariffs">
              <span class="chip-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
              </span>
              <span>ZESCO tariffs</span>
            </button>
            <button class="suggestion-chip" data-prompt="How do I contribute to NHIMA health insurance?" aria-label="Ask about NHIMA health insurance">
              <span class="chip-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
              </span>
              <span>NHIMA insurance</span>
            </button>
            <button class="suggestion-chip" data-prompt="What are the requirements for applying to UNZA?" aria-label="Ask about applying to UNZA">
              <span class="chip-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.66 2.69 3 6 3s6-1.34 6-3v-5"/><path d="M22 10v6"/></svg>
              </span>
              <span>UNZA application</span>
            </button>
            <button class="suggestion-chip" data-prompt="How do I apply for a National Registration Card (NRC)?" aria-label="Ask about applying for an NRC">
              <span class="chip-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              <span>NRC card</span>
            </button>
          </div>
        </div>

        <form id="chat-form" class="composer">
          <input
            id="message"
            name="message"
            type="text"
            placeholder="Ask about ZESCO, NHIMA, UNZA, ECZ..."
            autocomplete="off"
            maxlength="2000"
            enterkeyhint="send"
            required
          />
          <button type="submit" id="send-btn">Send</button>
        </form>
      </div>

      <footer class="app-footer">
        &copy; 2026 Francis Chileshe (ID: 2022014855) &bull; University of Zambia (UNZA) &bull; Final Year Project
      </footer>
    </main>

    <!-- Modular JS using ES6 modules -->
    <script type="module" src="./js/app.js?v=6"></script>
  </body>
</html>
