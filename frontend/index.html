<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zedchatbot | African Community Assistant</title>
    <meta name="description" content="A multilingual AI assistant for Zambian and Zimbabwean communities, powered by RAG technology." />
    <!-- Modular CSS -->
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <span class="eyebrow">Zambia-first RAG assistant</span>
        <h1>Zedchatbot</h1>
        <p class="intro">
          Access trusted information on local services, education, and government 
          right here. Select your language to get started.
        </p>
      </header>

      <div class="chat-card">
        <div class="controls">
          <label>
            Country
            <select id="country">
              <option value="zm">Zambia 🇿🇲</option>
              <option value="zw">Zimbabwe 🇿🇼</option>
            </select>
          </label>
          <label>
            Language
            <select id="language">
              <option value="en">English</option>
              <option value="bem">Bemba</option>
              <option value="ny">Nyanja</option>
              <option value="sn">Shona</option>
            </select>
          </label>
        </div>

        <div id="messages" class="messages">
          <!-- Initial greeting will be handled by JS -->
        </div>

        <!-- Quick Civic Suggestion Chips -->
        <div class="quick-prompts" id="quick-prompts" aria-label="Suggested questions">
          <button type="button" class="chip" data-prompt="What are the fees and requirements for an RTSA provisional driving license?" data-country="zm" data-lang="en">🪪 RTSA License</button>
          <button type="button" class="chip" data-prompt="What are the 2026 ZRA PAYE tax bands and TPIN registration steps?" data-country="zm" data-lang="en">💰 ZRA Taxes</button>
          <button type="button" class="chip" data-prompt="kuti nasenda shani passport yamu zambia?" data-country="zm" data-lang="bem">🇿🇲 Passport (Bemba)</button>
          <button type="button" class="chip" data-prompt="ndani angatenge nhima ndipo ndalama zake ndi zingati?" data-country="zm" data-lang="ny">🏥 NHIMA (Nyanja)</button>
          <button type="button" class="chip" data-prompt="What are the requirements and fees for a Zimbabwean biometric e-passport?" data-country="zw" data-lang="en">🇿🇼 Zim E-Passport</button>
        </div>

        <form id="chat-form" class="composer">
          <input
            id="message"
            name="message"
            type="text"
            placeholder="Ask about ZESCO, NHIMA, UNZA, ECZ..."
            autocomplete="off"
            required
          />
          <button type="submit" id="send-btn">Send</button>
        </form>
      </div>
      
      <footer style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-secondary); line-height: 1.6;">
        &copy; 2026 Francis Chileshe (ID: 2022014855) • University of Zambia (UNZA) • Final Year Project
      </footer>
    </main>

    <!-- Modular JS using ES6 modules -->
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
