<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zedchatbot | African Community Assistant</title>
  <meta name="description"
    content="A multilingual AI assistant for Zambian and Zimbabwean communities, powered by Grounded RAG technology." />
  <meta name="theme-color" content="#157a4c" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16120f" />

  <!-- Icons -->
  <link rel="icon" href="./assets/images/logo.jpeg" type="image/jpeg" />
  <link rel="apple-touch-icon" href="./assets/images/logo.jpeg" />

  <!-- Social preview (Open Graph / Twitter) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Zedchatbot | African Community Assistant" />
  <meta property="og:description"
    content="Instant, grounded answers on public IDs, tariffs, admissions and civic services for Zambian and Zimbabwean communities." />
  <meta property="og:image" content="./assets/images/hero-art-ndebele.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Zedchatbot | African Community Assistant" />
  <meta name="twitter:description"
    content="Instant, grounded answers on public IDs, tariffs, admissions and civic services." />
  <meta name="twitter:image" content="./assets/images/hero-art-ndebele.jpg" />

  <!-- Google Fonts: Outfit for clean, modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />

  <!-- Preload the hero artwork (largest contentful paint) -->
  <link rel="preload" as="image" href="./assets/images/hero-art-ndebele.webp" type="image/webp"
    fetchpriority="high" />
  <!--
    Hero artwork attribution (CC BY 4.0):
    "Ndebele Architecture" by Angela Abel — https://commons.wikimedia.org/wiki/File:Ndebele_Architecture.jpg
    Licensed under Creative Commons Attribution 4.0 (https://creativecommons.org/licenses/by/4.0/)
    -->
  <!-- Modular Styles -->
  <link rel="stylesheet" href="./css/main.css?v=15" />
  <link rel="stylesheet" href="./css/layout.css?v=15" />
  <link rel="stylesheet" href="./css/components.css?v=15" />

</head>

<body>
  <!-- Top Navigation Bar -->
  <header class="top-nav">
    <div class="nav-left">
      <a href="#" class="brand-link" id="brand-home" title="Reset to Home">
        <img src="./assets/images/logo.jpeg" alt="Zedchatbot Logo" class="brand-logo" />
        <span class="brand-title">zedchatbot</span>
      </a>
    </div>

    <div class="nav-right">
      <!-- Direct WhatsApp Action Pill -->
      <a href="https://wa.me/260953805423" target="_blank" rel="noopener noreferrer" class="nav-pill-btn whatsapp-pill"
        title="Chat on WhatsApp (+260 953805423)">
        <span class="pill-dot"></span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path
            d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-5.46-4.45-9.92-9.91-9.92zm0 18.15c-1.52 0-3.01-.41-4.31-1.18l-.31-.18-3.12.82.83-3.04-.2-.32a8.21 8.21 0 0 1-1.26-4.34c0-4.54 3.7-8.24 8.24-8.24 4.54 0 8.24 3.7 8.24 8.24 0 4.54-3.7 8.25-8.31 8.25zm4.52-6.17c-.25-.12-1.47-.72-1.7-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.15.17-.25.25-.42.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.23.25-.87.85-.87 2.07 0 1.22.89 2.4 1.01 2.57.12.17 1.75 2.67 4.24 3.75.59.26 1.06.41 1.42.52.6.19 1.14.16 1.57.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.12-.22-.19-.47-.31z" />
        </svg>
        <span>WhatsApp Bot</span>
      </a>

      <!-- Country Selector Dropdown -->
      <div class="select-pill-wrapper">
        <label for="country" class="sr-only">Country</label>
        <select id="country" class="select-pill" title="Choose country records">
          <option value="zm" selected>🇿🇲 Zambia</option>
          <option value="zw">🇿🇼 Zimbabwe</option>
        </select>
      </div>

      <!-- Language Selector Dropdown -->
      <div class="select-pill-wrapper">
        <label for="language" class="sr-only">Language</label>
        <select id="language" class="select-pill" title="Choose response language">
          <option value="en" selected>English</option>
          <option value="bem">icibemba</option>
          <option value="ny">chiNyanja</option>
          <option value="sn">chiShona</option>
        </select>
      </div>

      <!-- Dark Mode Toggle Button -->
      <button type="button" id="theme-toggle-btn" class="nav-icon-btn" title="Toggle Theme"
        aria-label="Toggle dark mode">
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <!-- New Chat Button -->
      <button type="button" id="new-chat-btn" class="nav-icon-btn" title="Start New Conversation">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
        <span>New</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-viewport" id="main-viewport">

    <!-- Hero Section — chitenge-framed African artwork -->
    <section class="hero-stage" id="hero-stage">
      <div class="hero-inner">
        <div class="hero-panel">
          <h1 class="hero-headline">For the African Community</h1>
          <p class="hero-subtext">Instant answers on public IDs, tariffs, admissions, and civic services.</p>
        </div>
      </div>
    </section>

    <!-- Messages Container (Visible during active conversation) -->
    <section class="conversation-stage" id="conversation-stage" style="display: none;">
      <div id="messages" class="messages-flow" role="log" aria-live="polite" aria-label="Conversation Messages">
        <!-- Messages rendered dynamically -->
      </div>
    </section>

    <!-- Chat Input Capsule Card (Centred in Hero, Docked in Chat) -->
    <section class="input-stage" id="input-stage">
      <form id="chat-form" class="chat-input-card">
        <!-- Textarea input -->
        <textarea id="message" name="message" class="chat-textarea" placeholder="Ask anything, explore together..."
          rows="1" maxlength="2000" autocomplete="off" required></textarea>

        <!-- Bottom Toolbar inside the input card -->
        <div class="card-toolbar">
          <div class="toolbar-right">
            <!-- Circular Green Send Button with Upward Arrow -->
            <button type="submit" id="send-btn" class="send-circle-btn" aria-label="Send message">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5" />
                <polyline points="5 12 12 5 19 12" />
              </svg>
            </button>
          </div>
        </div>
      </form>

      <!-- Suggestion Prompt Chips (rendered per selected country) -->
      <div class="suggestions-stage" id="suggestions-stage">
        <div class="suggestions-grid" id="suggestions-grid"></div>
      </div>
    </section>

  </main>

  <!-- Clean Footer -->
  <footer class="app-footer">
    <div class="footer-content">
      <span>&copy; 2026 Francis Chileshe (2022014855) &bull; University of Zambia (UNZA)</span>
      <span class="footer-divider">&bull;</span>
      <span>Final Year Project</span>
    </div>
  </footer>

  <!-- Modular Scripts -->
  <script type="module" src="./js/app.js?v=15"></script>
</body>

</html>
