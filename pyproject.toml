[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zedchatbot"
version = "0.1.0"
description = "Zambia-first multilingual RAG chatbot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings>=2.2.0",
    "python-dotenv",
    "python-multipart",
    "langchain-core",
    "chromadb>=0.4.0",
    "sentence-transformers",
    "openai>=1.0.0",
    "httpx",
    "langchain>=0.1.0",
    "langchain-community",
    "langchain-huggingface",
    "langchain-chroma",
    "langchain-openai",
    "langchain-google-genai",
    "tiktoken",
    "langdetect",
    "deep-translator",
    "twilio",
    "pypdf",
    "python-docx",
    "pandas",
    "matplotlib",
    "scikit-learn"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["src*"]
